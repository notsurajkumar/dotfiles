<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Piano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">

        <header>
            <div>
                <h1>🎹 Local Piano</h1>
                <p>Play using your laptop keyboard or mouse</p>
            </div>

            <div class="controls">
                <button id="octaveDown">− Octave</button>
                <span id="octaveDisplay">Octave: 4</span>
                <button id="octaveUp">+ Octave</button>
                <button id="sustain">Sustain: OFF</button>
            </div>
        </header>

        <section class="instructions">
            <strong>Keyboard:</strong>
            <span>A W S E D F T G Y H U J K O L P ;</span>
        </section>

        <section class="piano-container">
            <div class="piano" id="piano">

                <!-- White keys -->
                <div class="key white" data-note="C" data-key="a">
                    <span class="computer-key">A</span>
                    <span class="note">C</span>
                </div>

                <div class="key white" data-note="D" data-key="s">
                    <span class="computer-key">S</span>
                    <span class="note">D</span>
                </div>

                <div class="key white" data-note="E" data-key="d">
                    <span class="computer-key">D</span>
                    <span class="note">E</span>
                </div>

                <div class="key white" data-note="F" data-key="f">
                    <span class="computer-key">F</span>
                    <span class="note">F</span>
                </div>

                <div class="key white" data-note="G" data-key="g">
                    <span class="computer-key">G</span>
                    <span class="note">G</span>
                </div>

                <div class="key white" data-note="A" data-key="h">
                    <span class="computer-key">H</span>
                    <span class="note">A</span>
                </div>

                <div class="key white" data-note="B" data-key="j">
                    <span class="computer-key">J</span>
                    <span class="note">B</span>
                </div>

                <div class="key white" data-note="C" data-key="k">
                    <span class="computer-key">K</span>
                    <span class="note">C</span>
                </div>

                <div class="key white" data-note="D" data-key="l">
                    <span class="computer-key">L</span>
                    <span class="note">D</span>
                </div>

                <div class="key white" data-note="E" data-key=";">
                    <span class="computer-key">;</span>
                    <span class="note">E</span>
                </div>

                <!-- Black keys -->
                <div class="key black" data-note="C#" data-key="w">
                    <span class="computer-key">W</span>
                    <span class="note">C#</span>
                </div>

                <div class="key black" data-note="D#" data-key="e">
                    <span class="computer-key">E</span>
                    <span class="note">D#</span>
                </div>

                <div class="key black" data-note="F#" data-key="t">
                    <span class="computer-key">T</span>
                    <span class="note">F#</span>
                </div>

                <div class="key black" data-note="G#" data-key="y">
                    <span class="computer-key">Y</span>
                    <span class="note">G#</span>
                </div>

                <div class="key black" data-note="A#" data-key="u">
                    <span class="computer-key">U</span>
                    <span class="note">A#</span>
                </div>

                <div class="key black" data-note="C#" data-key="o">
                    <span class="computer-key">O</span>
                    <span class="note">C#</span>
                </div>

                <div class="key black" data-note="D#" data-key="p">
                    <span class="computer-key">P</span>
                    <span class="note">D#</span>
                </div>

            </div>
        </section>

        <footer>
            <span id="status">Click anywhere on the piano to start</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
